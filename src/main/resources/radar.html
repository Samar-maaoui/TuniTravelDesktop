<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Flight Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { width: 100%; height: 600px; }
        #search-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body onload="initMap()">
<div id="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher un vol (ex: AF123)">
    <button onclick="searchFlight()">🔍 Rechercher</button>
</div>
<div id="map"></div>

<script>
    let map;
    let planes = {};  // Stocke les avions sous forme { flightNumber: marker }
    let flightData = [];  // Contient toutes les données des vols en temps réel

    function initMap() {
        map = L.map('map').setView([13.7, 100.75], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Ajouter un exemple de vol pour tester la recherche
        addPlaneMarker(13.75, 100.80, "AF123");  // Vol fictif

        // Récupérer les vols en direct toutes les 30 secondes
        setInterval(loadFlights, 30000);  // Actualisation toutes les 30 secondes
    }

    function addPlaneMarker(lat, lng, flightNumber) {
        flightNumber = flightNumber.trim().toUpperCase();  // Nettoyage du numéro de vol
        console.log(`Ajout de l'avion : ${flightNumber} à (${lat}, ${lng})`);

        let icon = L.icon({
            iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/e/ec/Plane_icon.svg',
            iconSize: [50, 50], // Agrandissement de l'icône
            iconAnchor: [25, 25]
        });

        let marker = L.marker([lat, lng], { icon: icon, title: flightNumber })
            .addTo(map)
            .bindPopup(`<b>Vol:</b> ${flightNumber}`);

        planes[flightNumber] = marker;  // Stocke le marqueur avec le numéro de vol
        console.log("Avions enregistrés :", Object.keys(planes)); // Vérification
    }

    function loadFlights() {
        const API_URL = "https://flight-radar1.p.rapidapi.com/flights/list-in-boundary?bl_lat=13.607884&bl_lng=100.641975&tr_lat=13.771029&tr_lng=100.861566&limit=300";
        const API_KEY = "0d87b105c7mshbec63317fb28731p147f63jsnb31e1bef2997";  // Utilise ta propre clé API

        fetch(API_URL, {
            method: 'GET',
            headers: {
                'x-rapidapi-host': 'flight-radar1.p.rapidapi.com',
                'x-rapidapi-key': API_KEY
            }
        })
            .then(response => response.json())
            .then(data => {
                const aircraftArray = data.aircraft;
                flightData = aircraftArray;  // Stocke toutes les informations des vols

                // Met à jour la carte avec les nouveaux avions
                aircraftArray.forEach(flight => {
                    let flightNumber = flight[11] || "Unknown";
                    let latitude = flight[2];
                    let longitude = flight[3];

                    flightNumber = flightNumber.trim().toUpperCase();  // Normalisation du numéro de vol

                    // Si l'avion n'est pas déjà sur la carte, ajoute-le
                    if (!planes[flightNumber]) {
                        addPlaneMarker(latitude, longitude, flightNumber);
                    } else {
                        // Si l'avion est déjà sur la carte, met à jour sa position
                        planes[flightNumber].setLatLng([latitude, longitude]);
                    }
                });
            })
            .catch(error => {
                console.error("Erreur lors de la récupération des données des vols :", error);
            });
    }

    function searchFlight() {
        let flightNumber = document.getElementById("searchInput").value.trim().toUpperCase();
        console.log("Recherche du vol :", flightNumber);

        if (flightNumber === "") {
            alert("Veuillez entrer un numéro de vol.");
            return;
        }

        // Vérifie si l'avion existe dans l'objet planes
        if (planes[flightNumber]) {
            console.log("✅ Vol trouvé !");

            // Zoom sur la position de l'avion sur la carte
            map.setView(planes[flightNumber].getLatLng(), 12);  // Zoom sur l'avion
            planes[flightNumber].openPopup();  // Affiche l'info-bulle
        } else {
            console.log("❌ Vol non trouvé !");
            alert("Vol non trouvé !");
        }
    }
</script>
</body>
</html>
